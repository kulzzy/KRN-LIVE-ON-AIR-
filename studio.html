<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152f">
<title>Kulzzy Radio Broadcast Studio</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    background:#07152f;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    text-align:center;
    padding:24px 15px;
    border-bottom:1px solid #263653;
}

header h1{color:#ffd700;font-size:24px}
header p{font-size:11px;letter-spacing:2px;margin-top:7px}

.container{
    max-width:550px;
    margin:25px auto;
    padding:15px;
}

.card{
    background:#101f3c;
    border:1px solid #263653;
    border-radius:17px;
    padding:22px;
    margin-bottom:18px;
}

h2{
    color:#ffd700;
    font-size:17px;
    margin-bottom:20px;
}

label{
    display:block;
    font-size:12px;
    margin:17px 0 8px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #344767;
    border-radius:9px;
    background:#07152f;
    color:white;
    font-size:14px;
}

button{
    width:100%;
    padding:17px;
    border:0;
    border-radius:11px;
    margin-top:13px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{opacity:.4}

.gold{background:#ffd700;color:#07152f}
.red{background:#c62828;color:white}
.dark{background:#263653;color:white}

.status{
    padding:13px;
    background:#07152f;
    border-radius:9px;
    font-size:13px;
    color:#ffd700;
    margin-bottom:15px;
}

#message{
    color:#b9c5d9;
    font-size:13px;
    line-height:1.6;
    margin-top:15px;
}

.live-indicator{
    display:none;
    color:#ff5252;
    font-weight:bold;
    margin-bottom:15px;
}

footer{
    text-align:center;
    padding:25px;
    color:#aebbd0;
    font-size:12px;
}
</style>
</head>

<body>

<header>
    <h1>KULZZY RADIO</h1>
    <p>BROADCAST STUDIO</p>
</header>

<main class="container">

    <div class="card">

        <h2>STUDIO CONNECTION</h2>

        <div class="status" id="status">
            DISCONNECTED
        </div>

        <label>STREAMING SERVER ADDRESS</label>
        <input
            id="serverAddress"
            type="url"
            placeholder="wss://your-server-address/broadcast"
        >

        <label>BROADCAST PASSWORD</label>
        <input
            id="broadcastPassword"
            type="password"
            placeholder="Enter broadcast password"
        >

        <button class="gold" id="connectButton">
            CONNECT TO STUDIO
        </button>

        <div id="message">
            Enter your streaming server address and broadcast password.
        </div>

    </div>

    <div class="card">

        <h2>LIVE BROADCAST</h2>

        <div class="live-indicator" id="liveIndicator">
            ● LIVE ON AIR
        </div>

        <button class="gold" id="startButton" disabled>
            START LIVE BROADCAST
        </button>

        <button class="red" id="stopButton" disabled>
            STOP BROADCAST
        </button>

    </div>

</main>

<footer>
    KULZZY RADIO · CELEBRATING LIVES EVERYDAY
</footer>

<script>
const serverInput = document.getElementById("serverAddress");
const passwordInput = document.getElementById("broadcastPassword");
const connectButton = document.getElementById("connectButton");
const startButton = document.getElementById("startButton");
const stopButton = document.getElementById("stopButton");
const statusBox = document.getElementById("status");
const message = document.getElementById("message");
const liveIndicator = document.getElementById("liveIndicator");

let socket = null;
let microphone = null;
let recorder = null;
let connected = false;
let recording = false;
let manuallyStopping = false;

function showMessage(text){
    message.textContent = text;
}

function setStatus(text){
    statusBox.textContent = text;
}

function connectStudio(){

    const address = serverInput.value.trim();
    const password = passwordInput.value;

    if(!address || !password){
        showMessage("Enter the server address and password.");
        return;
    }

    if(!address.startsWith("wss://")){
        showMessage("A secure WSS address is required.");
        return;
    }

    try{

        socket = new WebSocket(address);

        socket.onopen = function(){

            socket.send(JSON.stringify({
                type:"authenticate",
                password:password
            }));

            setStatus("AUTHENTICATING");
            showMessage("Connecting to Kulzzy broadcast engine...");

        };

        socket.onmessage = function(event){

            let data;

            try{
                data = JSON.parse(event.data);
            }catch{
                return;
            }

            if(data.type === "ready"){

                connected = true;

                connectButton.disabled = true;
                startButton.disabled = false;

                setStatus("STUDIO CONNECTED");

                showMessage("Broadcast studio is ready.");

            }

            if(data.type === "error"){

                showMessage(data.message);
                setStatus("CONNECTION ERROR");

            }

            if(data.type === "stopped"){

                resetStudio();
                showMessage(data.message);

            }

        };

        socket.onerror = function(){

            setStatus("CONNECTION ERROR");
            showMessage("Unable to connect to broadcast server.");

        };

        socket.onclose = function(){

            resetStudio();

            if(!manuallyStopping){
                showMessage("Studio connection closed.");
            }

        };

    }catch(error){

        showMessage("Invalid server address.");

    }
}
